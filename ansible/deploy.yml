- name: Deploy Flightdeck
  hosts: all
  become: true
  tasks:
    - name: Read Flightdeck GitHub token
      set_fact:
        flightdeck_github_token: "{{ lookup('env', 'FLIGHTDECK_GITHUB_TOKEN') }}"
      no_log: true
    - name: Require Flightdeck deploy variables
      assert:
        that:
          - flightdeck_app_ref is defined and flightdeck_app_ref | length > 0
          - flightdeck_env_ref is defined and flightdeck_env_ref | length > 0
          - flightdeck_extra_refs is defined
          - flightdeck_path is defined and flightdeck_path | length > 0
          - flightdeck_keep_releases is defined
          - flightdeck_sops_age_key_file is defined and flightdeck_sops_age_key_file | length > 0
        fail_msg: "Set flightdeck_app_ref, flightdeck_env_ref, flightdeck_extra_refs, flightdeck_path, flightdeck_keep_releases, and flightdeck_sops_age_key_file"
    - name: Apply Flightdeck paths
      set_fact:
        flightdeck_release_name: "{{ ansible_facts['date_time'].iso8601_basic_short }}"
        flightdeck_release_path: "{{ flightdeck_path }}/releases/{{ ansible_facts['date_time'].iso8601_basic_short }}"
        flightdeck_shared_path: "{{ flightdeck_path }}/shared"
        flightdeck_current_path: "{{ flightdeck_path }}/current"
    - name: Ensure Flightdeck directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ flightdeck_path }}"
        - "{{ flightdeck_path }}/releases"
        - "{{ flightdeck_shared_path }}"
    - block:
        - name: Create app package pull directory
          tempfile:
            state: directory
            suffix: flightdeck-package
          register: flightdeck_app_pull
        - name: Pull Flightdeck package
          shell: |
            set -euo pipefail
            ref={{ flightdeck_app_ref | quote }}
            out={{ flightdeck_app_pull.path | quote }}
            asset=flightdeck.zip
            repo="${ref%@*}"
            tag="${ref#*@}"
            if [ "$repo" = "$ref" ] || [ -z "$repo" ] || [ -z "$tag" ]; then
              echo "Invalid release ref: $ref. Expected owner/repo@tag or owner/repo@tag:asset" >&2
              exit 1
            fi
            if [ "$tag" != "${tag%%:*}" ]; then
              asset="${tag#*:}"
              tag="${tag%%:*}"
            fi
            if [ -n "${FLIGHTDECK_GITHUB_TOKEN:-}" ]; then
              export GH_TOKEN="$FLIGHTDECK_GITHUB_TOKEN"
            fi
            if [ "$tag" = "latest" ]; then
              resolved_tag="$(gh release view --repo "$repo" --json tagName --jq .tagName)"
              if [ -z "$resolved_tag" ] || [ "$resolved_tag" = "null" ]; then
                echo "Could not resolve GitHub latest release for $repo" >&2
                exit 1
              fi
              echo "Resolved $repo@latest to $repo@$resolved_tag"
              tag="$resolved_tag"
            fi
            gh release download "$tag" --repo "$repo" --pattern "$asset" --dir "$out"
            test -f "$out/$asset"
            if [ "$asset" != "flightdeck.zip" ]; then
              cp "$out/$asset" "$out/flightdeck.zip"
            fi
          args:
            executable: /bin/bash
          environment:
            FLIGHTDECK_GITHUB_TOKEN: "{{ flightdeck_github_token }}"
        - name: Require Flightdeck bundle
          stat:
            path: "{{ flightdeck_app_pull.path }}/flightdeck.zip"
          register: flightdeck_bundle
        - name: Fail when Flightdeck bundle is missing
          fail:
            msg: "flightdeck.zip was not found in {{ flightdeck_app_ref }}"
          when: not flightdeck_bundle.stat.exists
        - name: Recreate release directory
          file:
            path: "{{ flightdeck_release_path }}"
            state: absent
        - name: Ensure release directory
          file:
            path: "{{ flightdeck_release_path }}"
            state: directory
            mode: "0755"
        - name: Extract Flightdeck release
          unarchive:
            src: "{{ flightdeck_app_pull.path }}/flightdeck.zip"
            dest: "{{ flightdeck_release_path }}"
            remote_src: true
        - name: Create extra packages pull directory
          tempfile:
            state: directory
            suffix: flightdeck-extra-packages
          register: flightdeck_extra_pull
          when: flightdeck_extra_refs | length > 0
        - name: Pull and merge extra app packages
          shell: |
            set -euo pipefail
            extra_root={{ flightdeck_extra_pull.path | quote }}
            release_apps={{ (flightdeck_release_path + '/apps') | quote }}
            download_release_ref() {
              ref="$1"
              out="$2"
              default_asset="$3"
              repo="${ref%@*}"
              tag="${ref#*@}"
              asset="$default_asset"
              if [ "$repo" = "$ref" ] || [ -z "$repo" ] || [ -z "$tag" ]; then
                echo "Invalid release ref: $ref. Expected owner/repo@tag or owner/repo@tag:asset" >&2
                exit 1
              fi
              if [ "$tag" != "${tag%%:*}" ]; then
                asset="${tag#*:}"
                tag="${tag%%:*}"
              fi
              if [ "$tag" = "latest" ]; then
                resolved_tag="$(gh release view --repo "$repo" --json tagName --jq .tagName)"
                if [ -z "$resolved_tag" ] || [ "$resolved_tag" = "null" ]; then
                  echo "Could not resolve GitHub latest release for $repo" >&2
                  exit 1
                fi
                echo "Resolved $repo@latest to $repo@$resolved_tag" >&2
                tag="$resolved_tag"
              fi
              gh release download "$tag" --repo "$repo" --pattern "$asset" --dir "$out"
              test -f "$out/$asset"
              echo "$out/$asset"
            }
            if [ -n "${FLIGHTDECK_GITHUB_TOKEN:-}" ]; then
              export GH_TOKEN="$FLIGHTDECK_GITHUB_TOKEN"
            fi
            {% for ref in flightdeck_extra_refs %}
            package_dir="$extra_root/{{ loop.index }}"
            mkdir -p "$package_dir/pull" "$package_dir/extract"
            bundle="$(download_release_ref {{ ref | quote }} "$package_dir/pull" flightdeck-extra.zip)"
            unzip "$bundle" -d "$package_dir/extract"
            if [ ! -d "$package_dir/extract/apps" ]; then
              echo "Extra package {{ ref }} does not contain apps/" >&2
              exit 1
            fi
            for app_path in "$package_dir/extract/apps"/*; do
              [ -d "$app_path" ] || continue
              app="$(basename "$app_path")"
              if [ -e "$release_apps/$app" ]; then
                echo "Extra app conflicts with an existing app: $app" >&2
                exit 1
              fi
              cp -a "$app_path" "$release_apps/"
            done
            {% endfor %}
          args:
            executable: /bin/bash
          environment:
            FLIGHTDECK_GITHUB_TOKEN: "{{ flightdeck_github_token }}"
          when: flightdeck_extra_refs | length > 0
        - name: Create env package pull directory
          tempfile:
            state: directory
            suffix: flightdeck-env-package
          register: flightdeck_env_pull
        - name: Pull encrypted env package
          shell: |
            set -euo pipefail
            ref={{ flightdeck_env_ref | quote }}
            out={{ flightdeck_env_pull.path | quote }}
            asset=
            repo="${ref%@*}"
            tag="${ref#*@}"
            if [ "$repo" = "$ref" ] || [ -z "$repo" ] || [ -z "$tag" ]; then
              echo "Invalid release ref: $ref. Expected owner/repo@tag or owner/repo@tag:asset" >&2
              exit 1
            fi
            if [ "$tag" != "${tag%%:*}" ]; then
              asset="${tag#*:}"
              tag="${tag%%:*}"
            fi
            if [ -n "${FLIGHTDECK_GITHUB_TOKEN:-}" ]; then
              export GH_TOKEN="$FLIGHTDECK_GITHUB_TOKEN"
            fi
            if [ "$tag" = "latest" ]; then
              resolved_tag="$(gh release view --repo "$repo" --json tagName --jq .tagName)"
              if [ -z "$resolved_tag" ] || [ "$resolved_tag" = "null" ]; then
                echo "Could not resolve GitHub latest release for $repo" >&2
                exit 1
              fi
              echo "Resolved $repo@latest to $repo@$resolved_tag"
              tag="$resolved_tag"
            fi
            if [ -z "$asset" ]; then
              asset="$tag.sops.env"
            fi
            gh release download "$tag" --repo "$repo" --pattern "$asset" --dir "$out"
            test -f "$out/$asset"
            cp "$out/$asset" "$out/.sops.env"
          args:
            executable: /bin/bash
          environment:
            FLIGHTDECK_GITHUB_TOKEN: "{{ flightdeck_github_token }}"
        - name: Check encrypted env payload
          stat:
            path: "{{ flightdeck_env_pull.path }}/.sops.env"
          register: flightdeck_sops_env
        - name: Require encrypted env payload
          fail:
            msg: ".sops.env was not found in {{ flightdeck_env_ref }}"
          when: not flightdeck_sops_env.stat.exists
        - name: Decrypt env to shared file
          shell: >
            SOPS_AGE_KEY_FILE={{ flightdeck_sops_age_key_file | quote }}
            sops decrypt {{ (flightdeck_env_pull.path + '/.sops.env') | quote }}
            > {{ (flightdeck_shared_path + '/.env.tmp') | quote }}
          no_log: true
        - name: Set env file permissions
          file:
            path: "{{ flightdeck_shared_path }}/.env.tmp"
            mode: "0600"
        - name: Publish env file
          command:
            cmd: "mv {{ flightdeck_shared_path }}/.env.tmp {{ flightdeck_shared_path }}/.env"
        - name: Ensure shared apps-data directory
          file:
            path: "{{ flightdeck_shared_path }}/apps-data"
            state: directory
            mode: "0755"
        - name: Link shared files into release
          file:
            src: "{{ item.src }}"
            dest: "{{ item.dest }}"
            state: link
            force: true
          loop:
            - src: "{{ flightdeck_shared_path }}/.env"
              dest: "{{ flightdeck_release_path }}/.env"
            - src: "{{ flightdeck_shared_path }}/apps-data"
              dest: "{{ flightdeck_release_path }}/apps-data"
        - name: Switch current release
          file:
            src: "{{ flightdeck_release_path }}"
            dest: "{{ flightdeck_current_path }}"
            state: link
            force: true
        - name: Deploy Flightdeck
          command:
            cmd: ./deploy.sh
            chdir: "{{ flightdeck_current_path }}"
        - name: Find Flightdeck releases
          find:
            paths: "{{ flightdeck_path }}/releases"
            file_type: directory
            recurse: false
          register: flightdeck_releases
        - name: Remove old Flightdeck releases
          file:
            path: "{{ item.path }}"
            state: absent
          loop: "{{ (flightdeck_releases.files | sort(attribute='mtime', reverse=true))[flightdeck_keep_releases | int:] }}"
      always:
        - name: Remove app package pull directory
          file:
            path: "{{ flightdeck_app_pull.path }}"
            state: absent
          when: flightdeck_app_pull is defined and flightdeck_app_pull.path is defined
        - name: Remove env package pull directory
          file:
            path: "{{ flightdeck_env_pull.path }}"
            state: absent
          when: flightdeck_env_pull is defined and flightdeck_env_pull.path is defined
        - name: Remove extra packages pull directory
          file:
            path: "{{ flightdeck_extra_pull.path }}"
            state: absent
          when: flightdeck_extra_pull is defined and flightdeck_extra_pull.path is defined
