- name: Deploy Flightdeck
  hosts: all
  become: true
  tasks:
    - name: Read Flightdeck GitHub token
      set_fact:
        flightdeck_github_token: "{{ lookup('env', 'FLIGHTDECK_GITHUB_TOKEN') }}"
      no_log: true
    - name: Require Flightdeck deploy variables
      assert:
        that:
          - flightdeck_app_ref is defined and flightdeck_app_ref | length > 0
          - flightdeck_env_refs is defined and flightdeck_env_refs | length > 0
          - flightdeck_app_refs is defined and flightdeck_app_refs | length > 0
          - flightdeck_apps is defined and flightdeck_apps | length > 0
          - flightdeck_path is defined and flightdeck_path | length > 0
          - flightdeck_keep_releases is defined
          - flightdeck_sops_age_key_file is defined and flightdeck_sops_age_key_file | length > 0
        fail_msg: "Set flightdeck_app_ref, flightdeck_env_refs, flightdeck_app_refs, flightdeck_apps, flightdeck_path, flightdeck_keep_releases, and flightdeck_sops_age_key_file"
    - name: Resolve Flightdeck user paths
      set_fact:
        flightdeck_user_home: "{{ '/root' if ansible_user == 'root' else '/home/' + ansible_user }}"
    - name: Expand Flightdeck user paths
      set_fact:
        flightdeck_path: "{{ flightdeck_path | regex_replace('^~', flightdeck_user_home) }}"
        flightdeck_sops_age_key_file: "{{ flightdeck_sops_age_key_file | regex_replace('^~', flightdeck_user_home) }}"
    - name: Apply Flightdeck paths
      set_fact:
        flightdeck_release_name: "{{ ansible_facts['date_time'].iso8601_basic_short }}"
        flightdeck_release_path: "{{ flightdeck_path }}/releases/{{ ansible_facts['date_time'].iso8601_basic_short }}"
        flightdeck_shared_path: "{{ flightdeck_path }}/shared"
        flightdeck_current_path: "{{ flightdeck_path }}/current"
    - name: Ensure Flightdeck directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ flightdeck_path }}"
        - "{{ flightdeck_path }}/releases"
        - "{{ flightdeck_shared_path }}"
    - block:
        - name: Create app package pull directory
          tempfile:
            state: directory
            suffix: flightdeck-package
          register: flightdeck_app_pull
        - name: Pull Flightdeck package
          shell: |
            set -euo pipefail
            ref={{ flightdeck_app_ref | quote }}
            out={{ flightdeck_app_pull.path | quote }}
            asset=flightdeck.zip
            repo="${ref%@*}"
            tag="${ref#*@}"
            if [ "$repo" = "$ref" ] || [ -z "$repo" ] || [ -z "$tag" ]; then
              echo "Invalid release ref: $ref. Expected owner/repo@tag or owner/repo@tag:asset" >&2
              exit 1
            fi
            if [ "$tag" != "${tag%%:*}" ]; then
              asset="${tag#*:}"
              tag="${tag%%:*}"
            fi
            if [ -n "${FLIGHTDECK_GITHUB_TOKEN:-}" ]; then
              export GH_TOKEN="$FLIGHTDECK_GITHUB_TOKEN"
            fi
            if [ "$tag" = "latest" ]; then
              resolved_tag="$(gh release view --repo "$repo" --json tagName --jq .tagName)"
              if [ -z "$resolved_tag" ] || [ "$resolved_tag" = "null" ]; then
                echo "Could not resolve GitHub latest release for $repo" >&2
                exit 1
              fi
              echo "Resolved $repo@latest to $repo@$resolved_tag"
              tag="$resolved_tag"
            fi
            gh release download "$tag" --repo "$repo" --pattern "$asset" --dir "$out"
            test -f "$out/$asset"
            if [ "$asset" != "flightdeck.zip" ]; then
              cp "$out/$asset" "$out/flightdeck.zip"
            fi
          args:
            executable: /bin/bash
          environment:
            FLIGHTDECK_GITHUB_TOKEN: "{{ flightdeck_github_token }}"
        - name: Require Flightdeck bundle
          stat:
            path: "{{ flightdeck_app_pull.path }}/flightdeck.zip"
          register: flightdeck_bundle
        - name: Fail when Flightdeck bundle is missing
          fail:
            msg: "flightdeck.zip was not found in {{ flightdeck_app_ref }}"
          when: not flightdeck_bundle.stat.exists
        - name: Recreate release directory
          file:
            path: "{{ flightdeck_release_path }}"
            state: absent
        - name: Ensure release directory
          file:
            path: "{{ flightdeck_release_path }}"
            state: directory
            mode: "0755"
        - name: Extract Flightdeck release
          unarchive:
            src: "{{ flightdeck_app_pull.path }}/flightdeck.zip"
            dest: "{{ flightdeck_release_path }}"
            remote_src: true
        - name: Ensure release apps directory
          file:
            path: "{{ flightdeck_release_path }}/apps"
            state: directory
            mode: "0755"
        - name: Create app packages pull directory
          tempfile:
            state: directory
            suffix: flightdeck-app-packages
          register: flightdeck_app_packages_pull
        - name: Pull and merge app packages
          shell: |
            set -euo pipefail
            packages_root={{ flightdeck_app_packages_pull.path | quote }}
            release_apps={{ (flightdeck_release_path + '/apps') | quote }}
            download_release_ref() {
              ref="$1"
              out="$2"
              default_asset="$3"
              repo="${ref%@*}"
              tag="${ref#*@}"
              asset="$default_asset"
              if [ "$repo" = "$ref" ] || [ -z "$repo" ] || [ -z "$tag" ]; then
                echo "Invalid release ref: $ref. Expected owner/repo@tag or owner/repo@tag:asset" >&2
                exit 1
              fi
              if [ "$tag" != "${tag%%:*}" ]; then
                asset="${tag#*:}"
                tag="${tag%%:*}"
              fi
              if [ "$tag" = "latest" ]; then
                resolved_tag="$(gh release view --repo "$repo" --json tagName --jq .tagName)"
                if [ -z "$resolved_tag" ] || [ "$resolved_tag" = "null" ]; then
                  echo "Could not resolve GitHub latest release for $repo" >&2
                  exit 1
                fi
                echo "Resolved $repo@latest to $repo@$resolved_tag" >&2
                tag="$resolved_tag"
              fi
              gh release download "$tag" --repo "$repo" --pattern "$asset" --dir "$out"
              test -f "$out/$asset"
              echo "$out/$asset"
            }
            if [ -n "${FLIGHTDECK_GITHUB_TOKEN:-}" ]; then
              export GH_TOKEN="$FLIGHTDECK_GITHUB_TOKEN"
            fi
            {% for ref in flightdeck_app_refs %}
            package_dir="$packages_root/{{ loop.index }}"
            mkdir -p "$package_dir/pull" "$package_dir/extract"
            bundle="$(download_release_ref {{ ref | quote }} "$package_dir/pull" flightdeck-apps.zip)"
            unzip "$bundle" -d "$package_dir/extract"
            if [ ! -d "$package_dir/extract/apps" ]; then
              echo "Package {{ ref }} does not contain apps/" >&2
              exit 1
            fi
            for app_path in "$package_dir/extract/apps"/*; do
              [ -d "$app_path" ] || continue
              app="$(basename "$app_path")"
              if [ -e "$release_apps/$app" ]; then
                echo "App conflicts with an existing app: $app" >&2
                exit 1
              fi
              cp -a "$app_path" "$release_apps/"
            done
            {% endfor %}
          args:
            executable: /bin/bash
          environment:
            FLIGHTDECK_GITHUB_TOKEN: "{{ flightdeck_github_token }}"
        - name: Create env packages pull directory
          tempfile:
            state: directory
            suffix: flightdeck-env-packages
          register: flightdeck_env_packages_pull
        - name: Pull, decrypt, and merge env packages
          shell: |
            set -euo pipefail
            packages_root={{ flightdeck_env_packages_pull.path | quote }}
            merged={{ (flightdeck_shared_path + '/.env.tmp') | quote }}
            seen_keys_file="$packages_root/seen-keys"
            : > "$seen_keys_file"
            : > "$merged"
            add_line() {
              key="${1%%=*}"
              if grep -qxF "$key" "$seen_keys_file"; then
                echo "Env key conflicts with an existing source: $key" >&2
                exit 1
              fi
              echo "$key" >> "$seen_keys_file"
              printf '%s\n' "$1" >> "$merged"
            }
            add_line {{ ('APPS=' + (flightdeck_apps | join(','))) | quote }}
            if [ -n "${FLIGHTDECK_GITHUB_TOKEN:-}" ]; then
              export GH_TOKEN="$FLIGHTDECK_GITHUB_TOKEN"
            fi
            {% for ref in flightdeck_env_refs %}
            pkg_dir="$packages_root/{{ loop.index }}"
            mkdir -p "$pkg_dir"
            ref={{ ref | quote }}
            asset=
            repo="${ref%@*}"
            tag="${ref#*@}"
            if [ "$repo" = "$ref" ] || [ -z "$repo" ] || [ -z "$tag" ]; then
              echo "Invalid release ref: $ref. Expected owner/repo@tag or owner/repo@tag:asset" >&2
              exit 1
            fi
            if [ "$tag" != "${tag%%:*}" ]; then
              asset="${tag#*:}"
              tag="${tag%%:*}"
            fi
            if [ "$tag" = "latest" ]; then
              resolved_tag="$(gh release view --repo "$repo" --json tagName --jq .tagName)"
              if [ -z "$resolved_tag" ] || [ "$resolved_tag" = "null" ]; then
                echo "Could not resolve GitHub latest release for $repo" >&2
                exit 1
              fi
              echo "Resolved $repo@latest to $repo@$resolved_tag" >&2
              tag="$resolved_tag"
            fi
            if [ -z "$asset" ]; then
              asset="$tag.sops.env"
            fi
            gh release download "$tag" --repo "$repo" --pattern "$asset" --dir "$pkg_dir"
            test -f "$pkg_dir/$asset"
            plain="$pkg_dir/plain.env"
            SOPS_AGE_KEY_FILE={{ flightdeck_sops_age_key_file | quote }} sops decrypt "$pkg_dir/$asset" > "$plain"
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              add_line "$line"
            done < "$plain"
            {% endfor %}
          args:
            executable: /bin/bash
          environment:
            FLIGHTDECK_GITHUB_TOKEN: "{{ flightdeck_github_token }}"
          no_log: true
        - name: Set env file permissions
          file:
            path: "{{ flightdeck_shared_path }}/.env.tmp"
            mode: "0600"
        - name: Publish env file
          command:
            cmd: "mv {{ flightdeck_shared_path }}/.env.tmp {{ flightdeck_shared_path }}/.env"
        - name: Ensure shared apps-data directory
          file:
            path: "{{ flightdeck_shared_path }}/apps-data"
            state: directory
            mode: "0755"
        - name: Link shared files into release
          file:
            src: "{{ item.src }}"
            dest: "{{ item.dest }}"
            state: link
            force: true
          loop:
            - src: "{{ flightdeck_shared_path }}/.env"
              dest: "{{ flightdeck_release_path }}/.env"
            - src: "{{ flightdeck_shared_path }}/apps-data"
              dest: "{{ flightdeck_release_path }}/apps-data"
        - name: Switch current release
          file:
            src: "{{ flightdeck_release_path }}"
            dest: "{{ flightdeck_current_path }}"
            state: link
            force: true
        - name: Deploy Flightdeck
          command:
            cmd: ./deploy.sh
            chdir: "{{ flightdeck_current_path }}"
        - name: Find Flightdeck releases
          find:
            paths: "{{ flightdeck_path }}/releases"
            file_type: directory
            recurse: false
          register: flightdeck_releases
        - name: Remove old Flightdeck releases
          file:
            path: "{{ item.path }}"
            state: absent
          loop: "{{ (flightdeck_releases.files | sort(attribute='mtime', reverse=true))[flightdeck_keep_releases | int:] }}"
      always:
        - name: Remove app package pull directory
          file:
            path: "{{ flightdeck_app_pull.path }}"
            state: absent
          when: flightdeck_app_pull is defined and flightdeck_app_pull.path is defined
        - name: Remove env packages pull directory
          file:
            path: "{{ flightdeck_env_packages_pull.path }}"
            state: absent
          when: flightdeck_env_packages_pull is defined and flightdeck_env_packages_pull.path is defined
        - name: Remove app packages pull directory
          file:
            path: "{{ flightdeck_app_packages_pull.path }}"
            state: absent
          when: flightdeck_app_packages_pull is defined and flightdeck_app_packages_pull.path is defined
