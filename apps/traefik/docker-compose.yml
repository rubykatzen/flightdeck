x-vault-env: &vault-env
  TRAEFIK_CERTIFICATESRESOLVERS_ACMERESOLVER_ACME_EMAIL: ${ADMIN_MAIL}
  TRAEFIK_CERTIFICATESRESOLVERS_ACMERESOLVER_ACME_DNSCHALLENGE_PROVIDER: ${DNS_CHALLENGE_PROVIDER:-}
  CF_DNS_API_TOKEN: ${DNS_CHALLENGE_TOKEN:-}
  DO_AUTH_TOKEN: ${DNS_CHALLENGE_TOKEN:-}
  HETZNER_API_TOKEN: ${DNS_CHALLENGE_TOKEN:-}
  VULTR_API_KEY: ${DNS_CHALLENGE_TOKEN:-}
  LINODE_TOKEN: ${DNS_CHALLENGE_TOKEN:-}
  GANDIV5_PERSONAL_ACCESS_TOKEN: ${DNS_CHALLENGE_TOKEN:-}
  DESEC_TOKEN: ${DNS_CHALLENGE_TOKEN:-}
  NJALLA_TOKEN: ${DNS_CHALLENGE_TOKEN:-}
  DUCKDNS_TOKEN: ${DNS_CHALLENGE_TOKEN:-}
x-internal-env: &internal-env
  TRAEFIK_CERTIFICATESRESOLVERS_ACMERESOLVER_ACME_STORAGE: /letsencrypt/acme.json
  TRAEFIK_CERTIFICATESRESOLVERS_ACMERESOLVER_ACME_HTTPCHALLENGE_ENTRYPOINT: http
  TRAEFIK_GLOBAL_CHECKNEWVERSION: false
  TRAEFIK_GLOBAL_SENDANONYMOUSUSAGE: false
  TRAEFIK_LOG_LEVEL: INFO
  TRAEFIK_ACCESSLOG: true
  TRAEFIK_API_DASHBOARD: true
  TRAEFIK_PING_ENTRYPOINT: traefik
  TRAEFIK_ENTRYPOINTS_HTTP_ADDRESS: ":80"
  TRAEFIK_ENTRYPOINTS_HTTPS_ADDRESS: ":443"
  TRAEFIK_ENTRYPOINTS_HTTPS_FORWARDEDHEADERS_TRUSTEDIPS: "172.16.0.0/12,10.0.0.0/8"
  TRAEFIK_ENTRYPOINTS_TRAEFIK_ADDRESS: ":8080"
  TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: false
  TRAEFIK_PROVIDERS_DOCKER_NETWORK: traefik
  TRAEFIK_PROVIDERS_DOCKER_WATCH: true
services:
  traefik:
    image: traefik
    environment:
      <<: [*vault-env, *internal-env]
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../../apps-data/${APP_NAME}:/letsencrypt
    networks:
      - traefik
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 5
networks:
  traefik:
    external: true
