include:
  - ../networks.yml
  - ../postgres-18.yml
  - ../clickhouse-26.5.yml
  - ../redis-8.yml
x-vault-env: &vault-env
  BASE_URL: https://${APP_NAME}.${DOMAIN}
  BETTER_AUTH_SECRET: ${SESSION_KEY}
  DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
  DISABLE_TELEMETRY: ${DISABLE_TELEMETRY:-true}
  MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
  POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
  CLICKHOUSE_PASSWORD: ${DATABASE_PASSWORD}
  REDIS_PASSWORD: ${DATABASE_PASSWORD}
x-internal-env: &internal-env
  NODE_ENV: production
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${APP_NAME}
  POSTGRES_USER: ${APP_NAME}
  CLICKHOUSE_HOST: http://clickhouse:8123
  CLICKHOUSE_DB: ${APP_NAME}
  REDIS_HOST: redis
  REDIS_PORT: 6379
services:
  client:
    image: ghcr.io/rybbit-io/rybbit-client
    extends:
      file: ../common.yml
      service: main
    expose:
      - 3002
    labels:
      - "traefik.http.services.${APP_NAME}.loadbalancer.server.port=3002"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: https://${APP_NAME}.${DOMAIN}
      NEXT_PUBLIC_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
    depends_on:
      - backend
  backend:
    image: ghcr.io/rybbit-io/rybbit-backend
    extends:
      file: ../common.yml
      service: api
    expose:
      - 3001
    labels:
      - "traefik.http.services.${APP_NAME}-api.loadbalancer.server.port=3001"
    environment:
      <<: [*vault-env, *internal-env]
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 5
  redis:
    command: ["redis-server", "--requirepass", "${DATABASE_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${DATABASE_PASSWORD}", "--no-auth-warning", "ping"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 5
