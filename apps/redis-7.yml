# connect as user default, password ${DATABASE_PASSWORD}
services:
  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${DATABASE_PASSWORD}"]
    restart: unless-stopped
    volumes:
      - ${DATA_DIR}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${DATABASE_PASSWORD}", "--no-auth-warning", "ping"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - internal
