x-labels: &labels
  - "traefik.enable=true"
  - "traefik.docker.network=traefik"
  - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
  - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=false"
  - "traefik.http.routers.${APP_NAME}-http.rule=Host(`${APP_NAME}.${DOMAIN}`)"
  - "traefik.http.routers.${APP_NAME}-http.entrypoints=http"
  - "traefik.http.routers.${APP_NAME}-http.middlewares=redirect-to-https"
  - "traefik.http.routers.${APP_NAME}.rule=Host(`${APP_NAME}.${DOMAIN}`)"
  - "traefik.http.routers.${APP_NAME}.entrypoints=https"
  - "traefik.http.routers.${APP_NAME}.tls.certresolver=acmeresolver"
x-labels-http: &labels-http
  - "traefik.enable=true"
  - "traefik.docker.network=traefik"
  - "traefik.http.routers.${APP_NAME}.rule=Host(`${APP_NAME}.${DOMAIN}`)"
  - "traefik.http.routers.${APP_NAME}.entrypoints=https"
  - "traefik.http.routers.${APP_NAME}.tls.certresolver=acmeresolver"
  - "traefik.http.routers.${APP_NAME}-plain.rule=Host(`${APP_NAME}.${DOMAIN}`)"
  - "traefik.http.routers.${APP_NAME}-plain.entrypoints=http"
x-labels-api: &labels-api
  - traefik.enable=true
  - traefik.docker.network=traefik
  - traefik.http.routers.${APP_NAME}-api.rule=Host(`${APP_NAME}.${DOMAIN}`) && PathPrefix(`/api`)
  - traefik.http.routers.${APP_NAME}-api.entrypoints=https
  - traefik.http.routers.${APP_NAME}-api.tls.certresolver=acmeresolver
x-env-file: &env-file
  - ./${APP_NAME}/.env
x-restart: &restart unless-stopped
x-logging: &logging
  options:
    max-size: 10m
services:
  main:
    env_file: *env-file
    restart: *restart
    labels: *labels
    networks:
      - internal
      - traefik
    logging: *logging
  main-http:
    env_file: *env-file
    restart: *restart
    labels: *labels-http
    networks:
      - internal
      - traefik
    logging: *logging
  api:
    env_file: *env-file
    restart: *restart
    labels: *labels-api
    networks:
      - internal
      - traefik
    logging: *logging
  host:
    env_file: *env-file
    restart: *restart
    network_mode: host
    logging: *logging
  side:
    env_file: *env-file
    restart: *restart
    networks:
      - internal
    logging: *logging
