services:
  redis:
    image: redis:8
    restart: unless-stopped
    # no auth configured - reachable at redis:6379 from any service on the internal network
    volumes:
      - ${DATA_DIR}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - internal
