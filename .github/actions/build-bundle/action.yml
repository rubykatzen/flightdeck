name: Build and upload bundle
description: Build a zip bundle from specified paths and upload it as a GitHub Release asset. Defaults to Flightdeck's own machinery bundle.
inputs:
  paths:
    description: Newline-separated paths to include in the bundle.
    required: false
    default: |
      .env.example
      backup.sh
      deploy.sh
      down.sh
      generate-env.sh
      lib.sh
      logs.sh
      restart.sh
      up.sh
      README.md
  bundle-name:
    description: Bundle archive filename.
    required: false
    default: flightdeck.zip
  release-tag:
    description: Release tag to upload the bundle asset to.
    required: true
  token:
    description: Token with permission to upload release assets.
    required: true
outputs:
  bundle-path:
    description: Path to the built bundle archive.
    value: ${{ steps.build.outputs.bundle-path }}
runs:
  using: composite
  steps:
    - name: Build bundle
      id: build
      shell: bash
      env:
        BUNDLE_NAME: ${{ inputs.bundle-name }}
        PATHS: ${{ inputs.paths }}
      run: |
        set -euo pipefail
        mkdir -p .bundle
        mapfile -t bundle_paths <<< "$PATHS"
        filtered_paths=()
        for path in "${bundle_paths[@]}"; do
          [ -n "$path" ] || continue
          filtered_paths+=("$path")
        done
        zip -r ".bundle/$BUNDLE_NAME" \
          "${filtered_paths[@]}" \
          -x '*.DS_Store' \
          -x 'apps/*/.env'
        if zipinfo -1 ".bundle/$BUNDLE_NAME" | grep -Eq '(^|/)(\.env|apps\.env)$|(^|/)(apps-data|backups)(/|$)'; then
          echo "Bundle contains runtime state or env files:" >&2
          zipinfo -1 ".bundle/$BUNDLE_NAME" | grep -E '(^|/)(\.env|apps\.env)$|(^|/)(apps-data|backups)(/|$)' >&2
          exit 1
        fi
        echo "bundle-path=.bundle/$BUNDLE_NAME" >> "$GITHUB_OUTPUT"
    - name: Upload bundle
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        RELEASE_TAG: ${{ inputs.release-tag }}
        BUNDLE_PATH: ${{ steps.build.outputs.bundle-path }}
      run: gh release upload "$RELEASE_TAG" "$BUNDLE_PATH" --clobber
