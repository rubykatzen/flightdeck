name: Load matrix
description: Validate config manifests and build an encrypt or deploy strategy matrix.
inputs:
  mode:
    description: Configuration type to load (encrypt or deploy).
    required: true
  name:
    description: Single manifest name to load, or all.
    required: false
    default: all
  directory:
    description: Directory containing YAML files. Defaults to encrypt for encrypt mode and targets for deploy mode.
    required: false
    default: ""
outputs:
  matrix:
    description: JSON strategy matrix containing validated configuration data.
    value: ${{ steps.load.outputs.matrix }}
  count:
    description: Number of targets in the matrix.
    value: ${{ steps.load.outputs.count }}
runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: python3 -m pip install --disable-pip-version-check --requirement "$GITHUB_ACTION_PATH/requirements.txt"
    - name: Load matrix
      id: load
      shell: bash
      env:
        DIRECTORY: ${{ inputs.directory }}
        MODE: ${{ inputs.mode }}
        NAME: ${{ inputs.name }}
      run: |
        directory_args=()
        if [ -n "$DIRECTORY" ]; then
          directory_args=(--directory "$DIRECTORY")
        fi
        python3 "$GITHUB_ACTION_PATH/scripts/load-matrix.py" "${directory_args[@]}" --mode "$MODE" --name "$NAME"
