name: Load vaults matrix
description: Read every vault manifest in a directory into a GitHub Actions matrix. No schema validation - encrypt-env re-parses and validates each manifest itself.
inputs:
  directory:
    description: Directory containing vault manifests.
    required: false
    default: vaults
  name:
    description: Single manifest name to load, or all.
    required: false
    default: all
outputs:
  matrix:
    description: JSON strategy matrix, one item per manifest, merging its parsed YAML fields with name and manifest.
    value: ${{ steps.load.outputs.matrix }}
  count:
    description: Number of manifests in the matrix.
    value: ${{ steps.load.outputs.count }}
runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: python3 -m pip install --disable-pip-version-check --requirement "$GITHUB_ACTION_PATH/requirements.txt"
    - name: Load matrix
      id: load
      shell: bash
      env:
        DIRECTORY: ${{ inputs.directory }}
        NAME: ${{ inputs.name }}
      run: |
        python3 "$GITHUB_ACTION_PATH/scripts/load-vaults-matrix.py" --directory "$DIRECTORY" --name "$NAME"
