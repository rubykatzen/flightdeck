name: Load targets
description: Validate target manifests and build an encrypt or deploy strategy matrix.
inputs:
  mode:
    description: Target section to load (encrypt or deploy).
    required: true
  target:
    description: Target name to load, or all.
    required: false
    default: all
  directory:
    description: Directory containing target YAML files.
    required: false
    default: targets
outputs:
  matrix:
    description: JSON strategy matrix containing validated target data.
    value: ${{ steps.load.outputs.matrix }}
  count:
    description: Number of targets in the matrix.
    value: ${{ steps.load.outputs.count }}
runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: python3 -m pip install --disable-pip-version-check --requirement "$GITHUB_ACTION_PATH/requirements.txt"
    - name: Load targets
      id: load
      shell: bash
      env:
        DIRECTORY: ${{ inputs.directory }}
        MODE: ${{ inputs.mode }}
        TARGET: ${{ inputs.target }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/load-targets.py" --directory "$DIRECTORY" --mode "$MODE" --target "$TARGET"
