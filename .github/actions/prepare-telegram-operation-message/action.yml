name: Prepare Telegram operation message
description: Format a deploy or renovate notification as escaped Telegram MarkdownV2.
inputs:
  repository:
    description: Repository where the operation ran, in owner/repo form.
    required: true
  operation:
    description: Operation label shown in the linked header.
    required: true
  target:
    description: Deployment target name.
    required: true
  run-url:
    description: URL of the GitHub Actions run.
    required: true
  items:
    description: Optional JSON array of app and host objects to group below the header.
    required: false
    default: "[]"
outputs:
  message:
    description: Escaped Telegram MarkdownV2 message.
    value: ${{ steps.prepare.outputs.message }}
runs:
  using: composite
  steps:
    - name: Prepare message
      id: prepare
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
        OPERATION: ${{ inputs.operation }}
        TARGET: ${{ inputs.target }}
        RUN_URL: ${{ inputs.run-url }}
        ITEMS: ${{ inputs.items }}
      run: python3 "$GITHUB_ACTION_PATH/prepare.py"
