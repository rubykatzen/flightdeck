name: Renovate (shared)
on:
  workflow_call:
    inputs:
      app:
        description: App name to renovate (re-pull its image and recreate its containers).
        type: string
        required: true
      target-name:
        description: Target name, used only to label the Telegram notification.
        type: string
        required: true
      hosts:
        description: JSON array of user@host SSH destinations to renovate.
        type: string
        required: true
      apps:
        description: JSON object of this target's own apps mapping, as declared in its targets/*.yml manifest.
        type: string
        required: true
      path:
        description: Base path on the target host for the current symlink.
        type: string
        default: "~/flightdeck"
      tailscale-oauth-client-id:
        description: Tailscale OAuth client ID used to join the tailnet. Leave unset to skip joining a tailnet (e.g. when the runner already has network access to the hosts).
        type: string
        default: ""
      tailscale-tags:
        description: Comma-separated ACL tags for the ephemeral tailnet node.
        type: string
        default: tag:ci
    secrets:
      ssh-private-key:
        description: SSH private key used to connect to the hosts.
        required: true
      tailscale-oauth-secret:
        description: Tailscale OAuth client secret used to join the tailnet. Required only when tailscale-oauth-client-id is set.
        required: false
      telegram-bot-token:
        description: Telegram bot token used to notify when an update is found.
        required: true
      telegram-chat-id:
        description: Telegram chat ID used to notify when an update is found.
        required: true
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
      - name: Install deploy dependencies
        shell: bash
        run: pip install --user --break-system-packages -r deploy/requirements.txt
      - uses: tailscale/github-action@v4
        if: inputs.tailscale-oauth-client-id != ''
        with:
          oauth-client-id: ${{ inputs.tailscale-oauth-client-id }}
          oauth-secret: ${{ secrets.tailscale-oauth-secret }}
          tags: ${{ inputs.tailscale-tags }}
      - name: Load SSH key
        shell: bash
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add - <<< "${{ secrets.ssh-private-key }}"
      - name: Run renovate
        id: run
        shell: bash
        env:
          APP: ${{ inputs.app }}
          HOSTS: ${{ inputs.hosts }}
          TARGET_PATH: ${{ inputs.path }}
          TARGET_APPS: ${{ inputs.apps }}
        run: |
          jq -n --arg app "$APP" --argjson hosts "$HOSTS" --arg path "$TARGET_PATH" --argjson apps "$TARGET_APPS" \
            '{app: $app, hosts: $hosts, path: $path, apps: $apps}' \
            | python3 deploy/renovate.py
      - name: Notify Telegram
        if: steps.run.outputs.updated == 'true'
        uses: rubykatzen/baseline/.github/actions/send-telegram-message@v0.16.1
        with:
          message: "Renovate: ${{ inputs.app }} updated on ${{ inputs.target-name }} (${{ steps.run.outputs.updated_hosts }})"
          telegram-bot-token: ${{ secrets.telegram-bot-token }}
          telegram-chat-id: ${{ secrets.telegram-chat-id }}
