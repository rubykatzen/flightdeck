name: Renovate (shared)
on:
  workflow_call:
    inputs:
      app:
        description: App name to renovate (re-pull its image and recreate its containers) wherever it's currently deployed.
        type: string
        required: true
      targets-directory:
        description: Directory of target manifests to search for the app.
        type: string
        default: targets
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install deploy dependencies
        shell: bash
        run: pip install --user --break-system-packages -r deploy/requirements.txt
      - name: Start SSH agent
        shell: bash
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
      - name: Run renovate
        shell: bash
        env:
          APP: ${{ inputs.app }}
          TARGETS_DIRECTORY: ${{ inputs.targets-directory }}
          GITHUB_SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          jq -n --arg app "$APP" --arg targets_directory "$TARGETS_DIRECTORY" \
            '{app: $app, targets_directory: $targets_directory}' \
            | python3 deploy/renovate.py
