name: Renovate (shared)
on:
  workflow_call:
    inputs:
      apps:
        description: Comma-separated app name(s) to renovate (re-pull their image and recreate their containers).
        type: string
        required: true
      target-manifest:
        description: Path to this target's manifest file in the calling repository's own targets/ directory, e.g. targets/heimdall.yml.
        type: string
        required: true
      tailscale-oauth-client-id:
        description: Tailscale OAuth client ID used to join the tailnet. Leave unset to skip joining a tailnet (e.g. when the runner already has network access to the hosts).
        type: string
        default: ""
      tailscale-tags:
        description: Comma-separated ACL tags for the ephemeral tailnet node.
        type: string
        default: tag:ci
    secrets:
      ssh-private-key:
        description: SSH private key used to connect to the hosts.
        required: true
      tailscale-oauth-secret:
        description: Tailscale OAuth client secret used to join the tailnet. Required only when tailscale-oauth-client-id is set.
        required: false
      telegram-bot-token:
        description: Telegram bot token used to notify when an update is found.
        required: true
      telegram-chat-id:
        description: Telegram chat ID used to notify when an update is found.
        required: true
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .flightdeck
      - name: Install deploy dependencies
        shell: bash
        run: pip install --user --break-system-packages -r .flightdeck/deploy/requirements.txt
      - uses: tailscale/github-action@v4
        if: inputs.tailscale-oauth-client-id != ''
        with:
          oauth-client-id: ${{ inputs.tailscale-oauth-client-id }}
          oauth-secret: ${{ secrets.tailscale-oauth-secret }}
          tags: ${{ inputs.tailscale-tags }}
      - name: Load SSH key
        shell: bash
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add - <<< "${{ secrets.ssh-private-key }}"
      - name: Run renovate
        id: run
        shell: bash
        env:
          APPS: ${{ inputs.apps }}
          TARGET_MANIFEST: ${{ inputs.target-manifest }}
        run: |
          jq -n --arg apps "$APPS" --arg target_manifest "$TARGET_MANIFEST" \
            '{apps: $apps, target_manifest: $target_manifest}' \
            | python3 .flightdeck/deploy/renovate.py
      - name: Notify Telegram
        if: steps.run.outputs.updated == 'true'
        uses: rubykatzen/baseline/.github/actions/send-telegram-message@v0.16.1
        with:
          message: "Renovate: updated on ${{ steps.run.outputs.target_name }} (${{ steps.run.outputs.updated_hosts }})"
          telegram-bot-token: ${{ secrets.telegram-bot-token }}
          telegram-chat-id: ${{ secrets.telegram-chat-id }}
