name: Deploy
on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target to redeploy. Use "all" to redeploy every target.
        type: string
        default: all
jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      count: ${{ steps.targets.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/load-targets
        id: targets
        with:
          mode: deploy
          target: ${{ inputs.target || 'all' }}
  deploy:
    needs: targets
    if: needs.targets.outputs.count != '0'
    strategy:
      matrix: ${{ fromJson(needs.targets.outputs.matrix) }}
    uses: $/.github/workflows/deploy-shared.yml
    with:
      hosts: ${{ toJson(matrix.hosts) }}
      app-ref: ${{ matrix.flightdeck_ref }}
      env-ref: ${{ matrix.env_ref }}
      extra-refs: ${{ toJson(matrix.extra_refs) }}
      path: ${{ matrix.path }}
      keep-releases: ${{ matrix.keep_releases }}
      sops-age-key-file: ${{ matrix.sops_age_key_file }}
      tailscale-oauth-client-id: ${{ vars[matrix.tailscale_oauth_client_id_variable] }}
    secrets:
      ssh-private-key: ${{ secrets[matrix.ssh_private_key_secret] }}
      tailscale-oauth-secret: ${{ secrets[matrix.tailscale_oauth_secret] }}
