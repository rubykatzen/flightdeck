name: Publish SOPS env (shared)
on:
  workflow_call:
    inputs:
      manifest:
        description: Path to the YAML env manifest.
        type: string
        required: true
      release-tag:
        description: Release tag to ensure exists and publish the encrypted asset to. Defaults to the manifest's own release_tag.
        type: string
        default: ""
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release-tag }}
          MANIFEST: ${{ inputs.manifest }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag="$(grep -m1 '^release_tag:' "$MANIFEST" | sed 's/^release_tag:[[:space:]]*//')"
          fi
          if [ -z "$tag" ]; then
            echo "::error::No release-tag input and no release_tag in $MANIFEST" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Ensure release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "$TAG" \
              --notes "Encrypted env release." \
              --target main
      - uses: $/.github/actions/publish-sops-env
        with:
          manifest: ${{ inputs.manifest }}
          release-tag: ${{ steps.tag.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_SECRETS_JSON: ${{ toJson(secrets) }}
          GITHUB_VARS_JSON: ${{ toJson(vars) }}
