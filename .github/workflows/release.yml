name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
  upload:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: $/.github/actions/build-bundle
        with:
          bundle-name: flightdeck.zip
          release-tag: ${{ needs.release.outputs.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          paths: |
            apps
            ansible.cfg
            .env.example
            backup.sh
            deploy.sh
            down.sh
            generate-env.sh
            lib.sh
            logs.sh
            restart.sh
            up.sh
            README.md
  encrypt-configs:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: $/.github/actions/load-yaml-matrix
        id: matrix
        with:
          directory: vaults
  encrypt:
    needs: [release, encrypt-configs]
    if: needs.encrypt-configs.outputs.count != '0'
    strategy:
      matrix: ${{ fromJson(needs.encrypt-configs.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: $/.github/actions/encrypt-env
        with:
          manifest: ${{ matrix.manifest }}
          release-tag: ${{ needs.release.outputs.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_SECRETS_JSON: ${{ toJson(secrets) }}
          GITHUB_VARS_JSON: ${{ toJson(vars) }}
  deploy-targets:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: $/.github/actions/load-yaml-matrix
        id: matrix
        with:
          directory: targets
  deploy:
    needs: [upload, encrypt, deploy-targets]
    if: needs.deploy-targets.outputs.count != '0'
    strategy:
      matrix: ${{ fromJson(needs.deploy-targets.outputs.matrix) }}
    uses: $/.github/workflows/deploy-shared.yml
    with:
      hosts: ${{ toJson(matrix.hosts) }}
      app-ref: ${{ matrix.flightdeck_ref }}
      env-ref: ${{ matrix.env_ref }}
      extra-refs: ${{ matrix.extra_refs && toJson(matrix.extra_refs) || '[]' }}
      path: ${{ matrix.path || '~/flightdeck' }}
      keep-releases: ${{ matrix.keep_releases || 5 }}
      sops-age-key-file: ${{ matrix.sops_age_key_file || '~/.config/sops/age/keys.txt' }}
      tailscale-oauth-client-id: ${{ vars[matrix.credentials.variables.tailscale_oauth_client_id] }}
    secrets:
      ssh-private-key: ${{ secrets[matrix.credentials.secrets.ssh_private_key] }}
      tailscale-oauth-secret: ${{ secrets[matrix.credentials.secrets.tailscale_oauth_secret] }}
