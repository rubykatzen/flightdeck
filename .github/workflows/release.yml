name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
  upload-apps:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: $/.github/actions/build-apps-bundle
        with:
          release-tag: ${{ needs.release.outputs.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
  encrypt-vaults:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: $/.github/actions/load-vaults-matrix
        id: matrix
  encrypt:
    needs: [release, encrypt-vaults]
    if: needs.encrypt-vaults.outputs.count != '0'
    strategy:
      matrix: ${{ fromJson(needs.encrypt-vaults.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: $/.github/actions/encrypt-env
        with:
          manifest: ${{ matrix.manifest }}
          release-tag: ${{ needs.release.outputs.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_SECRETS_JSON: ${{ toJson(secrets) }}
          GITHUB_VARS_JSON: ${{ toJson(vars) }}
  deploy-targets:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.load-targets.outputs.matrix }}
      count: ${{ steps.load-targets.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: $/.github/actions/load-targets-matrix
        id: load-targets
  deploy:
    needs: [release, upload-apps, encrypt, deploy-targets]
    if: needs.deploy-targets.outputs.count != '0'
    strategy:
      matrix: ${{ fromJson(needs.deploy-targets.outputs.matrix) }}
    uses: $/.github/workflows/deploy-shared.yml
    with:
      target-manifest: ${{ matrix.manifest }}
      target-manifest-ref: ${{ needs.release.outputs.tag_name }}
      tailscale-oauth-client-id: ${{ vars.TAILSCALE_OAUTH_CLIENT_ID }}
    secrets:
      ssh-private-key: ${{ secrets[matrix.ssh_private_key_secret] }}
      tailscale-oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
      sops-age-key: ${{ secrets[matrix.sops_age_key_secret] }}
