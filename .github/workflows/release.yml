name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
  upload-apps:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: $/.github/actions/build-apps-bundle
        with:
          release-tag: ${{ needs.release.outputs.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
  load-vaults:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.load-vaults.outputs.matrix }}
      count: ${{ steps.load-vaults.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: $/.github/actions/load-vaults-matrix
        id: load-vaults
  encrypt:
    needs: [release, load-vaults]
    if: needs.load-vaults.outputs.count != '0'
    strategy:
      matrix: ${{ fromJson(needs.load-vaults.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: $/.github/actions/encrypt-env
        with:
          manifest: ${{ matrix.manifest }}
          release-tag: ${{ needs.release.outputs.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_SECRETS_JSON: ${{ toJson(secrets) }}
          GITHUB_VARS_JSON: ${{ toJson(vars) }}
  deploy:
    needs: [release, upload-apps, encrypt]
    if: needs.release.outputs.release_created == 'true'
    uses: $/.github/workflows/deploy.yml
    secrets: inherit
