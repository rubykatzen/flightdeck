name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

  upload:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: ./.github/workflows/upload-bundle-shared.yml
    with:
      ref: ${{ needs.release.outputs.tag_name }}
      release-tag: ${{ needs.release.outputs.tag_name }}
      bundle-name: flightdeck.zip
      paths: |
        apps
        ansible.cfg
        .env.example
        backup.sh
        deploy.sh
        down.sh
        generate-env.sh
        lib.sh
        logs.sh
        restart.sh
        up.sh
        README.md
