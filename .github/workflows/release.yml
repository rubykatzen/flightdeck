name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

  # This packages flightdeck's own release bundle (core scripts + apps/ +
  # README). A consumer repo publishing its own apps/ as an extra bundle for
  # flightdeck_extra_refs should call upload-apps-shared.yml instead, not
  # copy this job -- it's pre-configured for that exact use case.
  upload:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: ./.github/workflows/upload-bundle-shared.yml
    with:
      ref: ${{ needs.release.outputs.tag_name }}
      release-tag: ${{ needs.release.outputs.tag_name }}
