name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

  upload:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: $/.github/actions/build-bundle
        with:
          bundle-name: flightdeck.zip
          release-tag: ${{ needs.release.outputs.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          paths: |
            apps
            ansible.cfg
            .env.example
            backup.sh
            deploy.sh
            down.sh
            generate-env.sh
            lib.sh
            logs.sh
            restart.sh
            up.sh
            README.md
  hawkeye-env:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/publish-sops-env
        with:
          manifest: targets/hawkeye.yml
          release-tag: ${{ needs.release.outputs.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_SECRETS_JSON: ${{ toJson(secrets) }}
          GITHUB_VARS_JSON: ${{ toJson(vars) }}
