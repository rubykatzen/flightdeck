name: Deploy (shared)
on:
  workflow_call:
    inputs:
      inventory:
        description: Ansible inventory, e.g. a comma-separated Tailscale host list.
        type: string
        required: true
      user:
        description: SSH user for the Ansible connection.
        type: string
        default: root
      extra-vars:
        description: "JSON object passed to ansible-playbook as -e (flightdeck_env_ref, flightdeck_path, etc). flightdeck_app_ref defaults to the ref this workflow was called at (the @tag on the uses: line) and only needs to be set here to override that."
        type: string
        required: true
      tailscale-oauth-client-id:
        description: Tailscale OAuth client ID used to join the tailnet. Leave unset to skip joining a tailnet (e.g. when the runner already has network access to the inventory hosts).
        type: string
        default: ""
      tailscale-tags:
        description: Comma-separated ACL tags for the ephemeral tailnet node.
        type: string
        default: tag:ci
    secrets:
      ssh-private-key:
        description: SSH private key used to connect to the inventory hosts.
        required: true
      tailscale-oauth-secret:
        description: Tailscale OAuth client secret used to join the tailnet. Required only when tailscale-oauth-client-id is set.
        required: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve flightdeck ref
        id: ref
        shell: bash
        run: |
          ref="${{ github.workflow_ref }}"
          ref="${ref#*@}"
          ref="${ref#refs/tags/}"
          ref="${ref#refs/heads/}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: rubykatzen/flightdeck
          ref: ${{ steps.ref.outputs.ref }}
      - name: Install ansible-core
        shell: bash
        run: pip install --user --break-system-packages ansible-core
      - uses: tailscale/github-action@v4
        if: inputs.tailscale-oauth-client-id != ''
        with:
          oauth-client-id: ${{ inputs.tailscale-oauth-client-id }}
          oauth-secret: ${{ secrets.tailscale-oauth-secret }}
          tags: ${{ inputs.tailscale-tags }}
      - name: Load SSH key
        shell: bash
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add - <<< "${{ secrets.ssh-private-key }}"
      - name: Run playbook
        shell: bash
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"
        run: |
          ansible-playbook ansible/deploy.yml \
            -i "${{ inputs.inventory }}" \
            -u "${{ inputs.user }}" \
            -e "{\"flightdeck_app_ref\":\"rubykatzen/flightdeck@${{ steps.ref.outputs.ref }}\"}" \
            -e "${{ inputs.extra-vars }}"
