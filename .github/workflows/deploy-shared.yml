name: Deploy (shared)
on:
  workflow_call:
    inputs:
      target-manifest:
        description: Path to this target's manifest file in the calling repository's own targets/ directory, e.g. targets/heimdall.yml.
        type: string
        required: true
      target-manifest-ref:
        description: Git ref to check out this repository at when reading target-manifest. Leave unset to use the default branch (e.g. set this to a release tag when the caller itself pinned its own checkout to one, so both reads agree).
        type: string
        default: ""
      tailscale-oauth-client-id:
        description: Tailscale OAuth client ID used to join the tailnet. Leave unset to skip joining a tailnet (e.g. when the runner already has network access to the hosts).
        type: string
        default: ""
      tailscale-tags:
        description: Comma-separated ACL tags for the ephemeral tailnet node.
        type: string
        default: tag:ci
    secrets:
      ssh-private-key:
        description: SSH private key used to connect to the hosts.
        required: true
      sops-age-key:
        description: Private SOPS age key used to decrypt this target's vault-sourced env, on the runner.
        required: true
      tailscale-oauth-secret:
        description: Tailscale OAuth client secret used to join the tailnet. Required only when tailscale-oauth-client-id is set.
        required: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-manifest-ref }}
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .flightdeck
      - name: Install deploy dependencies
        shell: bash
        run: pip install --user --break-system-packages -r .flightdeck/deploy/requirements.txt
      - name: Install sops
        shell: bash
        env:
          SOPS_VERSION: "3.13.1"
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64" \
            --output /usr/local/bin/sops
          chmod +x /usr/local/bin/sops
      - uses: tailscale/github-action@v4
        if: inputs.tailscale-oauth-client-id != ''
        with:
          oauth-client-id: ${{ inputs.tailscale-oauth-client-id }}
          oauth-secret: ${{ secrets.tailscale-oauth-secret }}
          tags: ${{ inputs.tailscale-tags }}
      - name: Load SSH key
        shell: bash
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add - <<< "${{ secrets.ssh-private-key }}"
      - name: Run deploy
        shell: bash
        env:
          TARGET_MANIFEST: ${{ inputs.target-manifest }}
          SOPS_AGE_KEY: ${{ secrets.sops-age-key }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -n --arg target_manifest "$TARGET_MANIFEST" --arg sops_age_key "$SOPS_AGE_KEY" \
            '{target_manifest: $target_manifest, sops_age_key: $sops_age_key}' \
            | python3 .flightdeck/deploy/deploy.py
