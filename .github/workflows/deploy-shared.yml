name: Deploy (shared)
on:
  workflow_call:
    inputs:
      inventory:
        description: Ansible inventory, e.g. a comma-separated Tailscale host list.
        type: string
        required: true
      user:
        description: SSH user for the Ansible connection.
        type: string
        default: root
      app-ref:
        description: "Release ref of the Flightdeck bundle to deploy (e.g. a version tag, or 'latest'). Independent of the @tag on the uses: line, which only controls which ref runs the playbook mechanism."
        type: string
        required: true
      env-ref:
        description: Release ref for the encrypted env package, in owner/repo@tag:asset format.
        type: string
        required: true
      extra-refs:
        description: Comma-separated release refs for optional extra app bundles.
        type: string
        default: ""
      path:
        description: Base path on the target host for releases, shared files, and the current symlink.
        type: string
        default: "~/flightdeck"
      keep-releases:
        description: Number of past releases to keep on the target host.
        type: number
        default: 5
      sops-age-key-file:
        description: Path to the server-local SOPS age key file. Defaults to ~/.config/sops/age/keys.txt for the connecting user.
        type: string
        default: ""
      tailscale-oauth-client-id:
        description: Tailscale OAuth client ID used to join the tailnet. Leave unset to skip joining a tailnet (e.g. when the runner already has network access to the inventory hosts).
        type: string
        default: ""
      tailscale-tags:
        description: Comma-separated ACL tags for the ephemeral tailnet node.
        type: string
        default: tag:ci
    secrets:
      ssh-private-key:
        description: SSH private key used to connect to the inventory hosts.
        required: true
      tailscale-oauth-secret:
        description: Tailscale OAuth client secret used to join the tailnet. Required only when tailscale-oauth-client-id is set.
        required: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
      - name: Install ansible-core
        shell: bash
        run: pip install --user --break-system-packages ansible-core
      - uses: tailscale/github-action@v4
        if: inputs.tailscale-oauth-client-id != ''
        with:
          oauth-client-id: ${{ inputs.tailscale-oauth-client-id }}
          oauth-secret: ${{ secrets.tailscale-oauth-secret }}
          tags: ${{ inputs.tailscale-tags }}
      - name: Load SSH key
        shell: bash
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add - <<< "${{ secrets.ssh-private-key }}"
      - name: Build extra-vars
        id: vars
        shell: bash
        env:
          APP_REF: rubykatzen/flightdeck@${{ inputs.app-ref }}
          ENV_REF: ${{ inputs.env-ref }}
          EXTRA_REFS: ${{ inputs.extra-refs }}
          DEPLOY_PATH: ${{ inputs.path }}
          KEEP_RELEASES: ${{ inputs.keep-releases }}
          SOPS_KEY_FILE: ${{ inputs.sops-age-key-file }}
          SSH_USER: ${{ inputs.user }}
        run: |
          if [ "$SSH_USER" = root ]; then
            home_dir=/root
          else
            home_dir="/home/$SSH_USER"
          fi
          deploy_path="${DEPLOY_PATH/#\~/$home_dir}"
          sops_key_file="$SOPS_KEY_FILE"
          if [ -z "$sops_key_file" ]; then
            sops_key_file="$home_dir/.config/sops/age/keys.txt"
          fi
          extra_refs_json="[]"
          if [ -n "$EXTRA_REFS" ]; then
            extra_refs_json="$(printf '%s' "$EXTRA_REFS" | jq -R 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')"
          fi
          json="$(jq -n \
            --arg app_ref "$APP_REF" \
            --arg env_ref "$ENV_REF" \
            --argjson extra_refs "$extra_refs_json" \
            --arg path "$deploy_path" \
            --argjson keep_releases "$KEEP_RELEASES" \
            --arg sops_key_file "$sops_key_file" \
            '{flightdeck_app_ref: $app_ref, flightdeck_env_ref: $env_ref, flightdeck_extra_refs: $extra_refs, flightdeck_path: $path, flightdeck_keep_releases: $keep_releases, flightdeck_sops_age_key_file: $sops_key_file}')"
          echo "json=$json" >> "$GITHUB_OUTPUT"
      - name: Run playbook
        shell: bash
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"
        run: |
          ansible-playbook ansible/deploy.yml \
            -i "${{ inputs.inventory }}" \
            -u "${{ inputs.user }}" \
            -e "${{ steps.vars.outputs.json }}"
