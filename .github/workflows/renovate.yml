name: Renovate
on:
  workflow_dispatch:
    inputs:
      app:
        description: App name to renovate (re-pull its image and recreate its containers) wherever it's currently deployed.
        type: string
        required: true
jobs:
  find-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.load-targets.outputs.matrix }}
      count: ${{ steps.load-targets.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/load-targets-matrix
        id: load-targets
  renovate:
    needs: find-targets
    if: needs.find-targets.outputs.count != '0'
    strategy:
      matrix: ${{ fromJson(needs.find-targets.outputs.matrix) }}
    uses: $/.github/workflows/renovate-shared.yml
    with:
      app: ${{ inputs.app }}
      target-manifest: ${{ matrix.manifest }}
      tailscale-oauth-client-id: ${{ vars.TAILSCALE_OAUTH_CLIENT_ID }}
    secrets:
      # Per-target, resolved by name from this target's own manifest.
      ssh-private-key: ${{ secrets[matrix.ssh_private_key_secret] }}
      # Fixed - the same for every target, not resolved from the manifest.
      tailscale-oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
      telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
