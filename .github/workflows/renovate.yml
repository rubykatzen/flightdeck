name: Renovate
on:
  workflow_dispatch:
    inputs:
      apps:
        description: JSON array of app name(s) to renovate (re-pull their image and recreate their containers) wherever each is currently deployed, e.g. ["traefik","rybbit"].
        type: string
        required: true
jobs:
  find-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.load-targets.outputs.matrix }}
      count: ${{ steps.load-targets.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/load-targets-matrix
        id: load-targets
  renovate:
    needs: find-targets
    if: needs.find-targets.outputs.count != '0'
    strategy:
      matrix: ${{ fromJson(needs.find-targets.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/renovate
        with:
          apps: ${{ inputs.apps }}
          target-manifest: ${{ matrix.manifest }}
          ssh-private-key: ${{ secrets[matrix.ssh_private_key_secret] }}
          tailscale-oauth-client-id: ${{ vars.TAILSCALE_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
