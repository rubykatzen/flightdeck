name: Upload apps (shared)
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out before building the bundle (e.g. a release tag).
        type: string
        required: true
      release-tag:
        description: Release tag to upload the bundle asset to.
        type: string
        required: true
jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: $/.github/actions/build-bundle
        with:
          bundle-name: apps.zip
          release-tag: ${{ inputs.release-tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          paths: |
            apps
