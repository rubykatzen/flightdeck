name: Pull request
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]
jobs:
  pull-request-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
