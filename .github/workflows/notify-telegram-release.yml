name: Notify Telegram release
on:
  release:
    types: [published]
jobs:
  notify:
    uses: rubykatzen/baseline/.github/workflows/notify-telegram-release-shared.yml@v0.17.0
    with:
      telegram-chat-id: ${{ vars.TELEGRAM_CHAT_ID }}
    secrets:
      telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
