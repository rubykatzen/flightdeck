name: Notify Telegram release
on:
  release:
    types: [published]
jobs:
  notify:
    uses: rubykatzen/baseline/.github/workflows/notify-telegram-release-shared.yml@v0.16.2
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
