encrypt:
  asset: hawkeye.sops.env
  keys:
    - hawkeye
  apps:
    - traefik
    - rybbit
  env:
    APPS_DOMAIN: RUBYKATZEN_COM_DOMAIN
    APPS_ADMIN_MAIL: RUBYKATZEN_COM_ADMIN_MAIL
    APPS_CERTIFICATE_RESOLVER: RUBYKATZEN_COM_CERT_RESOLVER
    APPS_CLOUDFLARE_DNS_API_TOKEN: RUBYKATZEN_COM_CLOUDFLARE_TOKEN
    APPS_DATABASE_PASSWORD: RUBYKATZEN_COM_DATABASE_PASSWORD
    APPS_KEY_HEX_32: RUBYKATZEN_COM_KEY_HEX_32
    APPS_TIMEZONE: RUBYKATZEN_COM_TIMEZONE
    TRAEFIK_HTTP_PORT: RUBYKATZEN_COM_TRAEFIK_HTTP_PORT
    TRAEFIK_HTTPS_PORT: RUBYKATZEN_COM_TRAEFIK_HTTPS_PORT
deploy:
  flightdeck_ref: rubykatzen/flightdeck@latest
  env_ref: rubykatzen/flightdeck@latest:hawkeye.sops.env
  extra_refs: []
  host:
    inventory:
      - 100.75.50.2
    user: rubykatzen-com
  credentials:
    variables:
      tailscale_oauth_client_id: TAILSCALE_OAUTH_CLIENT_ID
    secrets:
      ssh_private_key: DEPLOY_SSH_PRIVATE_KEY
      tailscale_oauth_secret: TAILSCALE_OAUTH_SECRET
